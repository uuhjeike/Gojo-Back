<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gojo Back</title>
<meta name="description" content="Gojo Back — personal profile.">
<meta name="theme-color" content="#04070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background layers -->
  <div class="bg" aria-hidden="true">
    <video
      id="bgVideo"
      class="bg__video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png">
      <source src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/6efa14de8ffe4c2358cb0ae55dc5785e_720w.mp4" type="video/mp4">
    </video>
    <img
      id="bgFallback"
      class="bg__fallback"
      src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png"
      alt=""
      hidden>
    <div class="bg__vignette"></div>
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__grain"></div>
  </div>

  <!-- Profile -->
  <header class="profile" id="profile">
    <div class="profile__halo" aria-hidden="true"></div>
    <div class="profile__ring">
      <img
        class="profile__photo"
        src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png"
        alt="Gojo Back profile photo"
        loading="eager"
        decoding="async">
    </div>
    <h1 class="profile__name">Gojo Back</h1>
    <div class="profile__rule" aria-hidden="true"></div>
  </header>

  <!-- Feed -->
  <main class="feed" id="feed" aria-label="Posts">
    <div class="feed__status" id="feedStatus" role="status">Loading posts…</div>
  </main>

  <!-- Templates -->
  <template id="tpl-post">
    <article class="post">
      <div class="post__meta"></div>
      <div class="post__text"></div>
      <div class="post__media"></div>
      <a class="post__source" target="_blank" rel="noopener noreferrer"></a>
    </article>
  </template>

  <script src="script.js" defer></script>
</body>
</html>
