<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gojo — Back</title>
<meta name="description" content="Gojo's profile — night thoughts, poems, moons and machines.">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" aria-label="Gojo — back to top">
      <img class="brand-avatar" src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png" alt="">
      <span class="brand-name">Gojo</span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" class="search-input" type="text" placeholder="Search posts and tags" autocomplete="off">
      <button id="searchClear" class="search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>

    <button id="savedToggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Show saved posts" title="Saved posts">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4V4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <video class="hero-video" id="heroVideo" autoplay muted loop playsinline preload="auto"
      poster="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png">
      <source src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/6efa14de8ffe4c2358cb0ae55dc5785e_720w.mp4" type="video/mp4">
    </video>
    <div class="hero-scrim"></div>
    <button class="mute-btn" id="muteBtn" type="button" aria-pressed="true" aria-label="Unmute background video">
      <svg id="muteIconOn" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg id="muteIconOff" viewBox="0 0 24 24" fill="none" hidden><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M15 9l5 6M20 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="hero-content">
      <div class="avatar-ring">
        <img class="avatar-img" src="https://raw.githubusercontent.com/uuhjeike/Gojo-Back/main/file_000000006f5482309020dd84155307a5.png" alt="Gojo's profile photo">
      </div>
      <h1 class="display-name">Gojo</h1>
      <p class="handle">@gojoback</p>
      <p class="bio">Poems after midnight, moons over the roof, and whatever else won't let me sleep.</p>
      <div class="stats" id="statsRow">
        <div class="stat"><strong id="statPosts">0</strong><span>posts</span></div>
        <div class="stat-sep" aria-hidden="true"></div>
        <div class="stat"><strong id="statPhotos">0</strong><span>photos</span></div>
        <div class="stat-sep" aria-hidden="true"></div>
        <div class="stat"><strong id="statClips">0</strong><span>clips</span></div>
      </div>
    </div>
  </section>

  <div class="feed-shell">
    <div class="feed-tabs" role="tablist" aria-label="Filter posts">
      <button class="feed-tab is-active" data-filter="all" role="tab" aria-selected="true" type="button">All</button>
      <button class="feed-tab" data-filter="text" role="tab" aria-selected="false" type="button">Words</button>
      <button class="feed-tab" data-filter="image" role="tab" aria-selected="false" type="button">Photos</button>
      <button class="feed-tab" data-filter="video" role="tab" aria-selected="false" type="button">Clips</button>
      <button class="feed-tab" data-filter="audio" role="tab" aria-selected="false" type="button">Audio</button>
      <button class="feed-tab" data-filter="link" role="tab" aria-selected="false" type="button">Links</button>
    </div>

    <p class="active-tag" id="activeTagBar" hidden>
      Filtering by <span id="activeTagLabel"></span>
      <button id="activeTagClear" type="button">Clear</button>
    </p>

    <section class="feed" id="feed" aria-live="polite"></section>

    <div class="empty-state" id="emptyState" hidden>
      <p>Nothing here.</p>
      <span>Try a different search, or clear the filter.</span>
    </div>
  </div>

  <footer class="site-footer">
    <span>Every post above is exactly as it was written — night owl hours, half-finished thoughts, and all.</span>
  </footer>
</main>

<button class="to-top" id="toTop" type="button" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous image" hidden>&#8249;</button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next image" hidden>&#8250;</button>
  <div class="lb-count" id="lbCount" hidden></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
